<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body class="hero"><img class="product" src="assets/mini.png"><div class="shade"></div><img class="logo" src="assets/logo.png"><div class="series">家的空气答案</div><div class="copy"><div class="line"></div><div class="eyebrow"></div><div class="title">350 m³/h</div><div class="sub">大新风量</div></div><div class="foot">产品示意；具体安装及性能以实物和说明书为准</div><script>const cp=document.querySelector('.copy');window.film={duration:3,width:720,height:1280,ready:document.fonts.ready,frame(t){let f=Math.max(0,Math.min(1,(t-.15)/.7));f=1-Math.pow(1-f,3);cp.style.opacity=f;cp.style.transform='translateY('+((1-f)*22)+'px)';document.querySelector('.line')?.style.setProperty('transform','scaleX('+f+')');const im=document.querySelector('.product');if(im)im.style.transform='scale('+(1.015+.035*t/3)+')';}};</script></body></html>
