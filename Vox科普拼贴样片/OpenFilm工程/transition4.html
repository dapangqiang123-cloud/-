<!doctype html><html><head><style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden}#paper{position:absolute;left:-120px;top:-120px;width:1320px;height:2160px;background:#3F3028;clip-path:polygon(2% 0,99% 0,100% 13%,99% 29%,100% 51%,99% 76%,100% 100%,0 100%,1% 70%,0 41%,1% 19%);box-shadow:0 0 50px #30251a33}</style></head><body><div id="paper"></div><script>window.film={width:1080,height:1920,duration:.48,frame(t){let p=Math.min(1,Math.max(0,t/.48));p=p*p*(3-2*p);document.querySelector('#paper').style.transform=`translateX(${1*(1-2*p)*1440}px) rotate(2deg)`;}};</script></body></html>
