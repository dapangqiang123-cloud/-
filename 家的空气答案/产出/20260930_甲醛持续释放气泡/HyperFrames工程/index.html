<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>甲醛持续释放气泡</title>
<style>
@font-face{font-family:"PingFang SC";src:local("PingFangSC-Medium");font-weight:600}
@font-face{font-family:"Helvetica Neue";src:local("HelveticaNeue-Medium");font-weight:600}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
*{box-sizing:border-box}
#main{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent}
.clip{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:cover}
#emissions{position:absolute;inset:0}
.bubble{position:absolute;transform-origin:center;will-change:transform,opacity}
.shell{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(233,182,111,.8);background:radial-gradient(circle at 29% 21%,rgba(255,245,223,.24),rgba(74,51,32,.72) 32%,rgba(74,51,32,.72) 63%,rgba(233,182,111,.25) 92%);box-shadow:inset 0 0 14px rgba(255,245,223,.14),0 2px 10px rgba(116,81,52,.13)}
.shell:before{content:"";position:absolute;left:17%;top:12%;width:36%;height:20%;border-radius:50%;border-top:3px solid rgba(255,245,223,.9);transform:rotate(-30deg)}
.shell:after{content:"";position:absolute;right:14%;bottom:14%;width:23%;height:17%;border-bottom:2px solid rgba(255,245,223,.55);border-radius:50%;transform:rotate(-36deg)}
.label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff5df;font-family:"PingFang SC",sans-serif;font-weight:600;font-size:34px;letter-spacing:1px;text-shadow:0 1px 4px rgba(62,40,20,.95),0 0 9px rgba(62,40,20,.45)}
.label.chemical{font-family:"Helvetica Neue",sans-serif;font-size:29px;letter-spacing:0}
.micro{position:absolute;width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,245,223,.7);background:rgba(233,182,111,.11)}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="2.35" data-width="1080" data-height="1920" data-fps="60">
<video id="footage" class="clip" data-start="0" data-duration="2.35" data-track-index="0" src="source.mp4" muted playsinline></video>
<audio id="sound" data-start="0" data-duration="2.35" data-track-index="2" src="source.mp4" data-volume="1"></audio>
<div id="emissions"></div>
</div>
<script src="gsap.min.js"></script>
<script>
const tl=gsap.timeline({paused:true});
const layer=document.getElementById('emissions');
const sources=[
 {x:115,y:1210,r:130,rise:310,drift:22,phase:.11,label:'甲醛'},
 {x:337,y:1060,r:113,rise:300,drift:-17,phase:.21,label:'HCHO'},
 {x:550,y:938,r:96,rise:250,drift:19,phase:.34,label:'甲醛'},
 {x:847,y:1130,r:108,rise:280,drift:24,phase:.15,label:'HCHO'},
 {x:425,y:1550,r:142,rise:325,drift:-30,phase:.29,label:'HCHO'},
 {x:759,y:1710,r:134,rise:340,drift:20,phase:.40,label:'甲醛'}
];
sources.forEach((s,i)=>{
 for(let k=0;k<3;k++){
  const start=s.phase+k*.94;if(start>=2.35)continue;
  const duration=1.72+(i%3)*.10;
  const size=s.r*(k===1?.83:1);
  const e=document.createElement('div');e.className='bubble';e.id=`bubble-${i}-${k}`;
  e.style.cssText=`left:${s.x-size/2+(k%2?19:0)}px;top:${s.y-size/2}px;width:${size}px;height:${size}px;`;
  const label=k===1?(s.label==='甲醛'?'HCHO':'甲醛'):s.label;
  e.innerHTML=`<div class="shell"></div><div class="label ${label==='HCHO'?'chemical':''}" style="font-size:${label==='HCHO'?size*.245:size*.285}px"><span>${label}</span></div>`;
  layer.appendChild(e);
  tl.from(e,{opacity:0,scale:.42,duration:.28,ease:['sine.out','power1.out','power2.out'][i%3]},start);
  tl.to(e,{y:-s.rise,duration,ease:'none'},start);
  tl.to(e,{x:s.drift,duration:duration*.55,ease:'sine.inOut'},start);
  tl.to(e,{x:s.drift*.5,duration:duration*.45,ease:'sine.inOut'},start+duration*.55);
  tl.to(e,{scale:1.12,duration:duration-.28,ease:'sine.out'},start+.28);
  tl.to(e,{opacity:0,duration:.45,ease:'sine.in'},start+duration-.45);
  const dot=document.createElement('div');dot.className='micro';dot.id=`micro-${i}-${k}`;
  dot.style.cssText=`left:${s.x+size*.4}px;top:${s.y+size*.3}px;`;
  layer.appendChild(dot);
  tl.from(dot,{opacity:0,scale:.3,duration:.22,ease:'sine.out'},start+.1);
  tl.to(dot,{y:-s.rise*.70,x:-s.drift*.8,duration:duration*.78,ease:'none'},start+.1);
  tl.to(dot,{opacity:0,duration:.32,ease:'sine.in'},start+duration*.78-.22);
 }
});
tl.to(layer,{x:57,y:0,duration:2.35,ease:'none'},0);
window.__timelines=window.__timelines||{};
window.__timelines.main=tl;
</script>
</body></html>
